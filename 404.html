<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1117">
  <meta name="robots" content="noindex">
  <title>404 · Página no encontrada | Miguel Morillo</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="contenido" class="wrap not-found-main">
    <p class="eyebrow"><span class="prompt" aria-hidden="true">$</span> locate /ruta/solicitada</p>
    <p class="not-found-code" aria-hidden="true">404</p>
    <h1>Esta ruta no existe</h1>
    <p class="not-found-copy">La página que buscas no está en este portafolio. Puede que el enlace haya cambiado o que la ruta esté mal escrita.</p>

    <pre class="not-found-terminal"><code>$ curl -I https://akisolu.github.io/portafolio/ruta
HTTP/2 <span class="err">404 Not Found</span></code></pre>

    <div class="actions">
      <a class="btn btn-primary" href="/portafolio/">Ir al inicio <span aria-hidden="true">→</span></a>
      <a class="btn btn-ghost" href="https://github.com/Akisolu" target="_blank" rel="noopener noreferrer">Ver GitHub <span aria-hidden="true">↗</span></a>
    </div>

    <p class="notice">Miguel Morillo · Akisolu</p>
  </main>
</body>
</html>
